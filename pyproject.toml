[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-camera-switcher"
version = "1.0.0"
description = "Automatically switches virtual camera feed based on gaze direction"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "pyvirtualcam>=0.10.0",
    "numpy>=1.24.0",
    "pystray>=0.19.0",
    "Pillow>=10.0.0",
    "pygrabber>=0.2 ; sys_platform == 'win32'",
]

[project.scripts]
vcs = "virtual_camera_switcher.main:main"

[project.gui-scripts]
# Windowless launcher: no cmd window, runs the tray app directly.
vcsw = "virtual_camera_switcher.main:main_gui"

[tool.setuptools.packages.find]
where = ["src"]
